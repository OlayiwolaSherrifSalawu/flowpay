name: flowpay_mobile
description: "FlowPay — Mobile-first Intelligent Financial Operating Layer for BMONI Infrastructure"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

  # BMONI Flutter Ecosystem
  bmoni_embedded_sdk: ^0.0.2
  bkey_uikit: ^0.0.1
  bmoni_embedded_wallets_cards: ^0.0.1

  # State Management & DI
  flutter_riverpod: ^3.2.1

  # Networking & Serialization
  http: ^1.2.0
  intl: ^0.19.0

  # Secure Storage (Never stores private keys — stores session & bmoniUserId)
  flutter_secure_storage: ^10.0.0

  # Typography & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
