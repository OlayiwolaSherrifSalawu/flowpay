name: flowpay_mobile
description: "FlowPay — cross-border wallets and payroll on the Stellar network"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter


  # State Management & DI
  flutter_riverpod: ^3.2.1

  # Networking & Serialization
  http: ^1.2.0
  intl: ^0.19.0
  crypto: ^3.0.7

  # Secure Storage (Never stores private keys — stores session & profile)
  flutter_secure_storage: ^10.0.0

  # Authentication & App-Level Lock
  local_auth: ^2.3.0
  local_auth_android: ^1.0.46
  local_auth_darwin: ^1.4.3

  # Typography & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  camera: ^0.12.1
  stellar_flutter_sdk: 3.8.0
  cryptography: 2.9.0
  qr_flutter: 4.1.0
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
